name: Presubmit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  github-release:
    name: Presumbit
    runs-on: ${{matrix.OS}}
    defaults:
      run:
        shell: pwsh
    strategy:
      matrix:
        include:
          - OS: windows-2022
            WORKFLOW: msbuild-windows-ci
            ARCHIVE: ZIP
            INSTALLER: INNOSETUP
          - OS: ubuntu-22.04
            WORKFLOW: ninja-linux-ci
            ARCHIVE: TGZ
            INSTALLER: External
    steps:
    - name: Checkout VulkanSC-SDK
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: REUSE Compliance Check
      if: ${{ contains(matrix.WORKFLOW, 'linux') }}
      uses: fsfe/reuse-action@v5

    - name: Get latest ninja
      if: ${{ contains(matrix.WORKFLOW, 'ninja') }}
      uses: urkle/action-get-ninja@v1

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: install python packages
      run: python3 -m pip install pyparsing

    - name: Get windowing system packages
      if: ${{ contains(matrix.WORKFLOW, 'linux') }}
      run: |
        sudo apt-get -qq update
        sudo apt install --yes cmake git gcc g++ pkg-config libx11-xcb-dev libwayland-dev xorg-dev

    - name: Configure
      run: cmake --preset ${{matrix.WORKFLOW}}

    - name: Build
      run: cmake --build --preset ${{matrix.WORKFLOW}}-release-install

    - name: Test
      run: ctest --preset ${{matrix.WORKFLOW}}-release

    - name: Package (archive)
      run: cpack -G ${{matrix.ARCHIVE}} -C Release --config ./build/CPackConfig.cmake -B ./package

    - name: Package (installer)
      run: cpack -G ${{matrix.INSTALLER}} -C Release --config ./build/CPackConfig.cmake -B ./package

    - name: Test cube-vksc build with SDK (No pipeline cache rebuild, linux)
      if: ${{ contains(matrix.WORKFLOW, 'linux') }}
      shell: bash
      run: |
        . ./install/setup-env.sh
        rm -rf build-cube-vksc
        cmake -S ./install/src/cube-vksc -B build-cube-vksc
        cmake --build build-cube-vksc

    - name: Test cube-vksc build with SDK (Rebuild pipeline cache, linux)
      if: ${{ contains(matrix.WORKFLOW, 'linux') }}
      shell: bash
      run: |
        . ./install/setup-env.sh
        rm -rf build-cube-vksc
        cmake -DREBUILD_PIPELINE_CACHE=ON -S ./install/src/cube-vksc -B build-cube-vksc
        cmake --build build-cube-vksc

    - name: Test cube-vksc build with SDK (No pipeline cache rebuild, windows)
      if: ${{ contains(matrix.WORKFLOW, 'windows') }}
      shell: cmd
      run: |
        @echo on
        .\install\setup-env.bat
        rmdir /s /q build-cube-vksc
        cmake -S .\install\src\cube-vksc -B build-cube-vksc
        cmake --build build-cube-vksc

    - name: Test cube-vksc build with SDK (Rebuild pipeline cache, windows)
      if: ${{ contains(matrix.WORKFLOW, 'windows') }}
      shell: cmd
      run: |
        @echo on
        .\install\setup-env.bat
        rmdir /s /q -rf build-cube-vksc
        cmake -DREBUILD_PIPELINE_CACHE=ON -S .\install\src\cube-vksc -B build-cube-vksc
        cmake --build build-cube-vksc
